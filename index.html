<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas Bareng</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════════════════════════════════════════
     HOME — PILIH ANGGOTA
══════════════════════════════════════════════ -->
<div id="screen-home" class="screen active">
  <div class="home-header">
    <div class="home-logo"><span>💰</span> Kas Bareng</div>
    <h1 class="home-title">Pilih <span class="accent">namamu</span></h1>
    <p class="home-sub">Cek status & bayar kas bulan ini</p>
  </div>

  <div class="month-badge" id="current-month-label">LOADING...</div>

  <div class="member-grid" id="member-grid">
    <!-- filled by JS -->
  </div>

  <div class="flex-row" style="max-width: 620px; width: 100%; margin: 24px auto 0;">
    <button class="btn btn-primary" onclick="openRegisterModal()" style="background: linear-gradient(135deg, #10b981, #3b82f6); flex: 2;">
      + Daftar Kas Bareng
    </button>
    <a class="btn btn-ghost" href="admin/index.html" style="text-decoration:none; display: flex; align-items: center; justify-content: center; flex: 1;">
      ⚙️ Admin
    </a>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     MODAL: LOGIN ANGGOTA
══════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-member-login">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-member-login')">✕</button>
    <div class="modal-title" id="login-modal-name"></div>
    <div class="modal-sub">Masukkan password kamu untuk masuk</div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="member-pw-input" placeholder="••••••" onkeydown="if(event.key==='Enter')loginMember()">
    </div>
    <div class="flex-row">
      <button class="btn btn-ghost" onclick="closeModal('modal-member-login')">Batal</button>
      <button class="btn btn-primary" onclick="loginMember()">Masuk →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     MODAL: REGISTER ANGGOTA BARU
══════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-register-member">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-register-member')">✕</button>
    <div class="modal-title">Daftar Anggota Baru</div>
    <div class="modal-sub">Buat profilmu untuk ikut Kas Bareng</div>
    
    <div class="form-group">
      <label>Nama Lengkap / Panggilan</label>
      <input type="text" id="reg-name-input" placeholder="Contoh: Budi Santoso" onkeydown="if(event.key==='Enter') document.getElementById('reg-pw-input').focus()">
    </div>
    <div class="form-group">
      <label>Buat Password</label>
      <input type="password" id="reg-pw-input" placeholder="Minimal 4 karakter" onkeydown="if(event.key==='Enter') registerMember()">
    </div>
    
    <div class="flex-row">
      <button class="btn btn-ghost" onclick="closeModal('modal-register-member')">Batal</button>
      <button class="btn btn-primary" onclick="registerMember()">Daftar Sekarang 🎉</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script type="module" src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
